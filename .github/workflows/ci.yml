name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions nécessaires pour que l'action de rapport de tests puisse publier ses résultats sur le workflow GitHub

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest

    # La matrice exécute ce job une fois par dossier de projet.
    # fail-fast: false permet aux deux jobs de tourner jusqu'au bout
    # même si l'un des deux échoue (utile pour voir les deux rapports).
    strategy:
      fail-fast: false
      matrix:
        project: [Angular, Java]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      
      # Détection automatique du type de projet (frontend/backend)
      
      - name: Détecter le type de projet
        id: detect
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f package.json ]; then
            echo "type=frontend" >> "$GITHUB_OUTPUT"
          elif [ -f build.gradle ]; then
            echo "type=backend" >> "$GITHUB_OUTPUT"
          else
            echo "Type de projet non reconnu dans ${{ matrix.project }}" >&2
            exit 1
          fi

     
      # Setup + cache spécifiques au frontend (condition sur le type détecté)
      
      - name: Setup Node.js
        if: steps.detect.outputs.type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Installer les dépendances npm
        if: steps.detect.outputs.type == 'frontend'
        working-directory: ${{ matrix.project }}
        run: npm ci --cache .npm --prefer-offline

      
      # Setup + cache spécifiques au backend
     
      - name: Setup JDK
        if: steps.detect.outputs.type == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      
      # Exécution des tests via  script unifié
     
      - name: Exécuter les tests
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh ${{ matrix.project }}

     
      # Publication du rapport JUnit dans l'interface GitHub Actions
     
    
      - name: Publier le rapport de tests
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results/${{ matrix.project }}/*.xml'
          check_name: "Résultats des tests - ${{ matrix.project }}"



  build:
    name: Build & Push (${{ matrix.project }})
    needs: test
    runs-on: ubuntu-latest

    # Nécessaire pour pouvoir pousser une image vers ghcr.io avec le
    # token automatique GITHUB_TOKEN (pas besoin de créer un secret manuel).
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        project: [Angular, Java]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      
      # Calcul des variables : nom d'image (minuscules obligatoires
      # pour ghcr.io) et tag "branche-sha" demandé par l'exercice
     
      - name: Calculer le nom d'image et le tag
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER=$(echo "${{ matrix.project }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-')

          echo "owner=$OWNER_LOWER" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_LOWER" >> "$GITHUB_OUTPUT"
          echo "tag=${BRANCH_SAFE}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.project }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Afficher le tag publié
        run: |
          echo "Image publiée : ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"






    
  release:
    name: Release
    needs: build
    # Une release ne doit sortir que depuis main, jamais depuis dev
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    # contents:write -> pour créer le tag Git + committer version/changelog
    # issues/pull-requests:write -> requis par @semantic-release/github pour
    #   commenter automatiquement les issues/PR liées aux commits publiés
    # packages:write -> pour retagger l'image Docker avec le numéro de version
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 = récupère tout l'historique Git, indispensable
          # pour que semantic-release puisse analyser tous les commits
          # depuis le dernier tag
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les variables communes
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "owner=$OWNER_LOWER" >> "$GITHUB_OUTPUT"
          echo "source_tag=main-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      
      # Release du frontend Angular
      # ---------------------------------------------------------
      - name: semantic-release (Angular)
        working-directory: Angular
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release \
            -p @semantic-release/changelog \
            -p @semantic-release/git \
            -p @semantic-release/github \
            -p @semantic-release/exec \
            -p @semantic-release/npm \
            semantic-release

      - name: Retagger l'image Angular avec la version sémantique
        if: hashFiles('angular-version.txt') != ''
        run: |
          VERSION=$(cat angular-version.txt)
          echo "Nouvelle version Angular : $VERSION"
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.meta.outputs.owner }}/angular:${VERSION} \
            ghcr.io/${{ steps.meta.outputs.owner }}/angular:${{ steps.meta.outputs.source_tag }}

      
      # Release du backend Java
      # ---------------------------------------------------------
      - name: semantic-release (Java)
        working-directory: Java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release \
            -p @semantic-release/changelog \
            -p @semantic-release/git \
            -p @semantic-release/github \
            -p @semantic-release/exec \
            semantic-release

      - name: Retagger l'image Java avec la version sémantique
        if: hashFiles('java-version.txt') != ''
        run: |
          VERSION=$(cat java-version.txt)
          echo "Nouvelle version Java : $VERSION"
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.meta.outputs.owner }}/java:${VERSION} \
            ghcr.io/${{ steps.meta.outputs.owner }}/java:${{ steps.meta.outputs.source_tag }}      